function PaymentScreen({ order, onBack, onSubmit }) {
  const [method, setMethod] = useState("UPI QR (DigiPay)");
  const [utr, setUtr] = useState("");
  const [error, setError] = useState("");
  const submitted = !!order;

  const pay = () => {
    if (method.startsWith("UPI") && utr.trim().length < 6) return setError("Enter the UPI transaction ID (UTR)");
    setError("");
    onSubmit({ method, utr: method.startsWith("UPI") ? utr.trim() : "" });

  return (

        <p className="text-2xl font-semibold">₹{order ? order.price : ""}</p>
        <p className="text-sm text-slate-600">{order ? `${order.data} · ${order.validity}` : ""}</p>

      {!submitted ? (

                <input type="radio" checked={method === m} onChange={() => setMethod(m)} />

              </label>
            ))}
          </div>
          {method.startsWith("UPI") ? (
            <div className="space-y-3">
              <div className="mx-auto w-44 h-44 rounded-3xl bg-white/70 border-2 border-dashed border-slate-300 flex items-center justify-center text-xs text-slate-500">UPI QR placeholder</div>
              <input value={utr} onChange={e => { setUtr(e.target.value.replace(/\s/g, "")); setError(""); }} placeholder="UPI transaction ID (UTR)"
                className="w-full rounded-2xl bg-white/70 border border-white/80 px-4 py-3 text-sm outline-none focus:border-blue-400" />
            </div>
          ) : (
            <p className="text-sm text-slate-600 rounded-2xl bg-amber-50/80 border border-amber-100 p-3">Hand over ₹{order ? order.price : ""} to the admin, then tap below.</p>
          )}
          {error && <p className="text-xs text-red-600">{error}</p>}
          <button onClick={pay} className="w-full bg-gradient-to-r from-blue-500 to-blue-700 text-white py-3.5 rounded-2xl font-medium shadow-lg">I have paid</button>
        </>
      ) : (
        <div className="rounded-3xl bg-white/70 backdrop-blur-xl border border-white/80 shadow-lg p-4 space-y-3">
          <h4 className="font-semibold">Status</h4>
          <Pill tone={STATUS_TEXT[order.status][1]}>{STATUS_TEXT[order.status][0]}</Pill>
          {order.utr && <p className="text-xs text-slate-500">UTR: {order.utr}</p>}
        </div>
      )}
    </div>
  );
}

/* ---------- PLAN BROWSER ---------- */
function PlanBrowser({ account, operator, onPlanPick }) {
  const [q, setQ] = useState("");
  const allPlans = getPlans(operator.key);
  const tabs = [...new Set(allPlans.map(p => p.cat))];
  const [tab, setTab] = useState(tabs[0]);

  const list = allPlans.filter(p => p.cat === tab &&
    (q === "" || String(p.price).includes(q.replace(/\D/g, "")) || p.data.toLowerCase().includes(q.toLowerCase())));

  return (
    <div>
      <div className="p-4">
        <div className="relative">
          <Ico name="search" className="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-500" />
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search for a plan or enter amount"
            className="w-full rounded-full bg-white/70 backdrop-blur border border-white/80 shadow-sm pl-11 pr-5 py-3 text-sm outline-none focus:border-blue-400" />
        </div>
      </div>
      {tabs.length > 0 && (
        <div className="flex gap-2 px-4 pb-3 overflow-x-auto">
          {tabs.map(t => (
            <button key={t} onClick={() => setTab(t)}
              className={`px-3.5 py-1.5 rounded-full text-sm whitespace-nowrap border transition ${tab === t ? "bg-blue-600 text-white border-blue-600 shadow" : "bg-white/60 backdrop-blur text-slate-600 border-white/80"}`}>{t}</button>
          ))}
        </div>
      )}
      <div className="p-4 pt-1 space-y-3">
        {tabs.length === 0 && <p className="text-sm text-slate-500 text-center py-10">{operator.name} plans will be added from the admin side.</p>}
        {tabs.length > 0 && list.length === 0 && <p className="text-sm text-slate-500 text-center py-10">No plans found.</p>}
        {list.map(p => (
          <button key={p.price + "-" + p.validity + "-" + p.cat} onClick={() => onPlanPick(p)}
            className="w-full text-left rounded-3xl bg-white/70 backdrop-blur-xl border border-white/80 shadow-md p-4 active:scale-[0.99] transition">
            <div className="flex items-center gap-4">
              <div className="text-3xl font-semibold w-28 shrink-0">₹{p.price.toLocaleString("en-IN")}</div>
              <dl className="grid grid-cols-[auto_1fr] gap-x-3 gap-y-1 text-sm flex-1">
                <dt className="text-slate-500">Data</dt><dd>{p.data}</dd>
                <dt className="text-slate-500">Validity</dt><dd>{p.validity}</dd>
                <dt className="text-slate-500">Calls</dt><dd className="truncate">{p.calls}</dd>
              </dl>
              <ArrowButton />
            </div>
            <div className="mt-3 pt-3 border-t border-white/80 text-xs text-slate-500 flex justify-between gap-2">
              <span>{p.benefits.length} benefit{p.benefits.length > 1 ? "s" : ""}</span>
              <span className="truncate">{p.benefits[0]}</span>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------- LINK MOBILE NUMBER PAGE ---------- */
function LinkAccountPage({ operator, accounts, recentNumbers, onBack, onLink, onEditAccount, onRemoveAccount, onPlanPick }) {
  const [dropOpen, setDropOpen] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [modalOpen, setModalOpen] = useState(false);
  const [mobile, setMobile] = useState("");
  const [nickname, setNickname] = useState("");
  const [circle, setCircle] = useState("");
  const [error, setError] = useState("");
  const mine = accounts.filter(a => a.operatorKey === operator.key);
  const selected = mine.find(a => a.id === selectedId) || mine[0];

  const submit = () => {
    if (!/^[6-9]\d{9}$/.test(mobile)) return setError("Enter a valid 10-digit mobile number");
    if (accounts.some(a => a.mobile === mobile && a.operatorKey === operator.key)) return setError("This number is already linked");
    if (!circle) return setError("Select circle");
    const acc = { id: Date.now(), operatorKey: operator.key, mobile, nickname: nickname.trim(), circle };
    onLink(acc);
    setSelectedId(acc.id);
    setMobile(""); setNickname(""); setCircle(""); setError(""); setModalOpen(false); setDropOpen(true);
  };

  const recents = recentNumbers.filter(r => r.operatorKey === operator.key).slice(0, 3);

  return (
    <div className="max-w-md mx-auto min-h-screen bg-gradient-to-b from-sky-100 via-white to-indigo-100 relative">
      <div className="flex items-center gap-4 px-4 py-4">
        <GlassBtn onClick={onBack} label="Back"><Ico name="arrowLeft" /></GlassBtn>
        <Logo op={operator} />
        <h1 className="text-lg font-semibold flex-1">{operator.name} Prepaid</h1>
        <GlassBtn label="More"><Ico name="more" /></GlassBtn>
      </div>

      {recents.length > 0 && (
        <div className="px-4 pb-2">
          <p className="text-xs text-slate-500 mb-2">Recent</p>
          <div className="flex gap-2 overflow-x-auto">
            {recents.map(r => (
              <button key={r.mobile} onClick={() => { const a = mine.find(x => x.mobile === r.mobile); if (a) { setSelectedId(a.id); } else { setMobile(r.mobile); setModalOpen(true); } }}
                className="shrink-0 px-3 py-1.5 rounded-full bg-white/70 backdrop-blur border border-white/80 shadow-sm text-sm">+91 {r.mobile}</button>
            ))}
          </div>
        </div>
      )}

      <div className="relative px-4 py-3">
        <button onClick={() => mine.length && setDropOpen(o => !o)}
          className="w-full flex items-center justify-between rounded-2xl bg-white/70 backdrop-blur-xl border border-white/80 shadow-md px-4 py-3.5 text-lg text-slate-900">
          <span>{selected ? `+91 ${selected.mobile}` : "No accounts linked"}</span>
          {mine.length > 0 && <span className={`w-8 h-8 rounded-full bg-white/80 border border-white shadow flex items-center justify-center text-slate-700 transition-transform ${dropOpen ? "rotate-180" : ""}`}><Ico name="chevronDown" className="w-4 h-4" /></span>}
        </button>

        {dropOpen && mine.length > 0 && (
          <div className="absolute left-4 right-4 top-full mt-2 z-20 rounded-2xl bg-white/60 backdrop-blur-xl border border-white/70 shadow-xl p-2">
            {mine.map(a => (
              <div key={a.id} className="flex items-center gap-2 px-2 py-2 rounded-xl hover:bg-white/70">
                <button onClick={() => { setSelectedId(a.id); setDropOpen(false); }} className="flex-1 text-left text-sm text-slate-900">
                  +91 {a.mobile}
                  {a.nickname && <span className="block text-xs text-slate-500">{a.nickname}</span>}
                </button>
                <GlassBtn label="Edit" className="!w-8 !h-8 text-blue-700" onClick={() => { setDropOpen(false); onEditAccount(a); }}><Ico name="edit" className="w-4 h-4" /></GlassBtn>
                <GlassBtn label="Unlink" className="!w-8 !h-8 text-red-600" onClick={() => { if (confirm("Unlink this number?")) { setDropOpen(false); onRemoveAccount(a.id); } }}><Ico name="trash" className="w-4 h-4" /></GlassBtn>
              </div>
            ))}
            <button onClick={() => { setDropOpen(false); setModalOpen(true); }} className="w-full text-left px-3 py-3 mt-1 rounded-xl text-sm text-blue-700 border-t border-white/70">+ Link another number</button>
          </div>
        )}
      </div>

      {mine.length === 0 && (
        <div className="flex flex-col items-center text-center px-8 pt-20 gap-4">
          <Logo op={operator} size="w-28 h-28" text="text-2xl" />
          <h2 className="text-2xl font-medium">{operator.name} Prepaid</h2>
          <p className="text-sm text-slate-600">Link your {operator.name} Prepaid mobile number to view plans and recharge now</p>
          <button onClick={() => setModalOpen(true)} className="text-blue-600 font-medium text-base pt-4">Link mobile number</button>
        </div>
      )}

      {selected && <PlanBrowser key={selected.id} account={selected} operator={operator} onPlanPick={onPlanPick} />}

      {modalOpen && (
        <div className="fixed inset-0 z-50 bg-black/25 backdrop-blur-sm flex items-center justify-center p-6">
          <div className="w-full max-w-sm rounded-3xl bg-white/80 backdrop-blur-xl border border-white/70 shadow-2xl p-5 space-y-4">
            <h3 className="text-lg font-semibold">Link mobile number</h3>
            <div className="flex gap-2">
              <div className="rounded-xl px-3 py-3 text-sm text-slate-600 bg-white/70 border border-white/80">+91</div>
              <input autoFocus value={mobile} inputMode="numeric" placeholder="Mobile number"
                onChange={e => { setMobile(e.target.value.replace(/\D/g, "").slice(0, 10)); setError(""); }}

            </div>
            <input value={nickname} onChange={e => setNickname(e.target.value)} placeholder="Nickname (optional)"
              className="w-full rounded-xl px-3 py-3 text-sm bg-white/70 border border-white/80 outline-none focus:border-blue-400" />
            <select value={circle} onChange={e => { setCircle(e.target.value); setError(""); }}
              className="w-full rounded-xl px-3 py-3 text-sm bg-white/70 border border-white/80 outline-none focus:border-blue-400">
              <option value="">Select circle</option>
              {CIRCLES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            {error && <p className="text-xs text-red-600">{error}</p>}
            <div className="flex gap-2">
              <button onClick={() => { setModalOpen(false); setError(""); }} className="flex-1 rounded-xl py-2.5 text-sm bg-white/70 border border-white/80">Cancel</button>
              <button onClick={submit} className="flex-1 bg-gradient-to-r from-blue-500 to-blue-700 text-white rounded-xl py-2.5 text-sm">Link</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- ADMIN DASHBOARD ---------- */
function AdminPanel({ orders, onVerify, onBack }) {
  const pending = orders.filter(o => o.status === "awaiting_verification").length;
  const dupes = orders.filter(o => o.status === "duplicate").length;
  const verifiedTotal = orders.filter(o => o.status === "verified").reduce((s, o) => s + o.price, 0);
  const utrCount = utr => orders.filter(o => o.utr && o.utr === utr).length;

  return (
    <div className="max-w-md mx-auto min-h-screen bg-gradient-to-b from-sky-100 via-white to-indigo-100 p-4 space-y-4">

      <div className="grid grid-cols-2 gap-3">
        {[["Today's orders", orders.length], ["To verify", pending], ["Duplicates", dupes], ["Verified ₹", verifiedTotal]].map(([label, val]) => (
          <div key={label} className="rounded-2xl bg-white/70 backdrop-blur-xl border border-white/80 shadow-md p-4">
            <p className="text-xs text-slate-500">{label}</p>
            <p className="text-2xl font-semibold mt-1">{val}</p>

      <h2 className="text-sm text-slate-600 pt-2">Orders</h2>
      {orders.length === 0 && <p className="text-sm text-slate-500">No orders yet.</p>}
      {[...orders].reverse().map(o => (
        <div key={o.id} className="rounded-2xl bg-white/70 backdrop-blur-xl border border-white/80 shadow-md p-4 space-y-2">
          <div className="flex justify-between items-start gap-2">
            <div>
              <p className="font-medium">+91 {o.mobile} · ₹{o.price}</p>
              <p className="text-xs text-slate-500">{o.operatorName} · {o.method}</p>

            <Pill tone={STATUS_TEXT[o.status][1]}>{STATUS_TEXT[o.status][0]}</Pill>

          {o.status === "awaiting_verification" && (
            <button onClick={() => onVerify(o.id)} className="text-sm bg-gradient-to-r from-green-500 to-emerald-600 text-white px-4 py-2 rounded-xl shadow">Verify payment</button>

  return (
    <div className={PAGE_BG}>
      <Header title="Electricity - select state" onBack={onBack} />
      <div className="px-4 pb-3">
        <div className="relative">
          <Ico name="search" className="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-500" />
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search state"
            className="w-full rounded-full bg-white/70 backdrop-blur border border-white/80 shadow-sm pl-11 pr-4 py-2.5 text-sm outline-none focus:border-blue-400" />
        </div>
      </div>
      <div className="px-4 pb-8">
        {states.map(s => <GlassRow key={s} title={s} sub={`${ELEC_DISCOMS.filter(d => d.state === s).length} DISCOM(s)`} onClick={() => onPick(s)} />)}
        {states.length === 0 && <p className="text-sm text-slate-500 text-center py-8">No state found.</p>}
      </div>
    </div>
  );
}

/* Step 2: DISCOM under the chosen state */
function ElecDiscoms({ state, onBack, onPick }) {
  const list = ELEC_DISCOMS.filter(d => d.state === state);
  return (
    <div className={PAGE_BG}>
      <Header title={state} onBack={onBack} />
      <div className="px-4 pb-8">
        <p className="text-sm text-slate-600 mb-3">Select your electricity provider (DISCOM)</p>
        {list.map(d => <GlassRow key={d.name} title={d.name} onClick={() => onPick(d)} />)}
      </div>
    </div>
  );
}

/* Step 3: consumer numbers (add / edit / remove) */
function ElecConsumer({ discom, accounts, onBack, onSave, onRemove, onOpenBill }) {
  const mine = accounts.filter(a => a.discom === discom.name);
  const [editing, setEditing] = useState(null);
  const [error, setError] = useState("");

  const save = () => {
    const no = (editing.consumerNo || "").trim();
    if (!/^\d{6,15}$/.test(no)) return setError("Enter a valid consumer number (6 to 15 digits)");
    onSave({ id: editing.id || Date.now(), discom: discom.name, state: discom.state, consumerNo: no, nickname: (editing.nickname || "").trim() });
    setEditing(null); setError("");
  };

  return (
    <div className={PAGE_BG}>
      <Header title={discom.name} onBack={onBack} />
      <div className="px-4 pb-8 space-y-3">
        {mine.map(a => (
          <div key={a.id} className="flex items-center gap-2 rounded-2xl bg-white/60 backdrop-blur-xl border border-white/80 shadow-md p-3">
            <button onClick={() => onOpenBill(a)} className="flex-1 text-left">
              <p className="font-medium">{a.consumerNo}</p>
              {a.nickname && <p className="text-xs text-slate-500">{a.nickname}</p>}
            </button>
            <GlassBtn label="Edit" className="!w-8 !h-8 text-blue-700" onClick={() => setEditing({ ...a })}><Ico name="edit" className="w-4 h-4" /></GlassBtn>
            <GlassBtn label="Remove" className="!w-8 !h-8 text-red-600" onClick={() => { if (confirm("Remove this consumer number?")) onRemove(a.id); }}><Ico name="trash" className="w-4 h-4" /></GlassBtn>
          </div>
        ))}

        {!editing && (
          <button onClick={() => setEditing({ consumerNo: "", nickname: "" })}
            className="w-full rounded-2xl bg-gradient-to-r from-blue-500 to-blue-700 text-white py-3 font-medium shadow-lg">+ Add consumer number</button>
        )}

        {editing && (
          <div className="rounded-3xl bg-white/70 backdrop-blur-xl border border-white/80 shadow-lg p-4 space-y-3">
            <input value={editing.consumerNo} inputMode="numeric" placeholder="Consumer number"
              onChange={e => { setEditing({ ...editing, consumerNo: e.target.value.replace(/\D/g, "").slice(0, 15) }); setError(""); }}
              className="w-full rounded-2xl bg-white/80 border border-white/80 px-4 py-3 text-sm outline-none focus:border-blue-400" />
            <input value={editing.nickname} placeholder="Nickname (optional)"
              onChange={e => setEditing({ ...editing, nickname: e.target.value })}
              className="w-full rounded-2xl bg-white/80 border border-white/80 px-4 py-3 text-sm outline-none focus:border-blue-400" />
            {error && <p className="text-xs text-red-600">{error}</p>}
            <div className="flex gap-2">
              <button onClick={() => { setEditing(null); setError(""); }} className="flex-1 rounded-xl py-2.5 text-sm bg-white/70 border border-white/80">Cancel</button>
              <button onClick={save} className="flex-1 rounded-xl py-2.5 text-sm text-white bg-gradient-to-r from-blue-500 to-blue-700">Save</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* Step 4: bill (live data comes from provider API later) */
function ElecBill({ account, onBack }) {
  return (
    <div className={PAGE_BG}>
      <Header title="Electricity bill" onBack={onBack} />
      <div className="px-4 space-y-4">
        <div className="rounded-3xl bg-white/70 backdrop-blur-xl border border-white/80 shadow-lg p-4 space-y-1">
          <p className="text-sm text-slate-600">{account.discom}</p>
          <p className="text-lg font-semibold">{account.consumerNo}</p>
          {account.nickname && <p className="text-xs text-slate-500">{account.nickname}</p>}
        </div>
        <div className="rounded-3xl bg-white/60 backdrop-blur-xl border border-white/80 shadow-md p-6 text-center text-sm text-slate-600">
          Bill amount and due date will appear here once the provider API is connected.
        </div>
        <button disabled className="w-full rounded-2xl bg-slate-300 text-white py-3.5 font-medium">Pay bill</button>
      </div>
    </div>
  );
}

/* ---------- APP ---------- */
function App() {
  const [view, setView] = useState("categories");
  const [operator, setOperator] = useState(null);
  const [accounts, setAccounts] = useState([]); // memory only; DB later
  const [activeAccount, setActiveAccount] = useState(null);
  const [activePlan, setActivePlan] = useState(null);
  const [orders, setOrders] = useState([]);
  const [activeOrderId, setActiveOrderId] = useState(null);
  const [elecState, setElecState] = useState(null);
  const [elecDiscom, setElecDiscom] = useState(null);
  const [utilAccounts, setUtilAccounts] = useState([]);
  const [activeUtil, setActiveUtil] = useState(null);

  const saveAccount = (updated) => {
    setAccounts(prev => prev.map(a => a.id === updated.id ? updated : a));
    setView("link");
  };

  const updateOrder = (id, patch) => setOrders(prev => prev.map(o => o.id === id ? { ...o, ...patch } : o));

  const submitPayment = ({ method, utr }) => {
    const id = Date.now();
    const plan = activePlan;
    const acc = activeAccount;
    setOrders(prev => [...prev, {
      id, mobile: acc.mobile, operatorName: operator.name, price: plan.price, data: plan.data,
      validity: plan.validity, method, utr, status: "processing",
    }]);
    setActiveOrderId(id);
    setTimeout(() => updateOrder(id, { status: "awaiting_verification" }), 3000);
  };

  // Admin verify: duplicate UTR check against orders already verified
  const verifyOrder = (id) => {
    const target = orders.find(o => o.id === id);
    const dup = target.utr && orders.some(o => o.id !== id && o.utr === target.utr && o.status === "verified");
    updateOrder(id, { status: dup ? "duplicate" : "verified" });
  };

  const recentNumbers = [...orders].reverse()
    .filter(o => o.status === "verified")
    .map(o => ({ mobile: o.mobile, operatorKey: OPERATORS.find(op => op.name === o.operatorName)?.key }))
    .filter((r, i, arr) => arr.findIndex(x => x.mobile === r.mobile) === i);

  if (view === "admin") {
    return <AdminPanel orders={orders} onVerify={verifyOrder} onBack={() => setView("categories")} />;
  }
  if (view === "operators") {
    return <OperatorList onBack={() => setView("categories")} onPick={op => { setOperator(op); setView("link"); }} />;
  }
  if (view === "link" && operator) {
    return <LinkAccountPage operator={operator} accounts={accounts} recentNumbers={recentNumbers}
      onBack={() => setView("operators")}
      onLink={acc => setAccounts(prev => [...prev, acc])}
      onEditAccount={a => { setActiveAccount(a); setView("edit"); }}
      onRemoveAccount={id => setAccounts(prev => prev.filter(a => a.id !== id))}
      onPlanPick={plan => {
        const acc = accounts.find(a => a.operatorKey === operator.key && a.mobile === (activeAccount?.mobile)) || null;
        setActivePlan(plan); setActiveAccount(acc || activeAccount);
        setView("details");
      }} />;
  }
  if (view === "details" && activePlan && operator) {
    return <PlanDetails plan={activePlan} operator={operator} account={activeAccount || accounts.find(a => a.operatorKey === operator.key)}
      onBack={() => setView("link")} onProceed={() => setView("payment")} />;
  }
  if (view === "payment" && activePlan && operator) {
    const order = orders.find(o => o.id === activeOrderId) || null;
    return <PaymentScreen order={order} onBack={() => setView("details")} onSubmit={submitPayment} />;
  }
  if (view === "edit" && activeAccount && operator) {
    return <AccountForm account={activeAccount} operator={operator} onBack={() => setView("link")} onSave={saveAccount} />;
  }
  if (view === "elec-state") {
    return <ElecStates onBack={() => setView("categories")} onPick={s => { setElecState(s); setView("elec-discom"); }} />;
  }
  if (view === "elec-discom" && elecState) {
    return <ElecDiscoms state={elecState} onBack={() => setView("elec-state")} onPick={d => { setElecDiscom(d); setView("elec-consumer"); }} />;
  }
  if (view === "elec-consumer" && elecDiscom) {
    return <ElecConsumer discom={elecDiscom} accounts={utilAccounts}
      onBack={() => setView("elec-discom")}
      onSave={acc => setUtilAccounts(prev => prev.some(a => a.id === acc.id) ? prev.map(a => a.id === acc.id ? acc : a) : [...prev, acc])}
      onRemove={id => setUtilAccounts(prev => prev.filter(a => a.id !== id))}
      onOpenBill={a => { setActiveUtil(a); setView("elec-bill"); }} />;
  }
  if (view === "elec-bill" && activeUtil) {
    return <ElecBill account={activeUtil} onBack={() => setView("elec-consumer")} />;
  }
  if (view === "dth") {
    return <DthProviders onBack={() => setView("categories")} />;
  }
  return <BillsCategories onAdmin={() => setView("admin")} onOpen={name => {
    if (name === "Mobile recharge") setView("operators");
    else if (name === "DTH / Cable TV") setView("dth");
    else if (name === "Electricity") setView("elec-state");
    else alert(name + " - coming soon");
  }} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
